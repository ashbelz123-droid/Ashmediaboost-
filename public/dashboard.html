<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AshMediaBoost | Dashboard</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>AshMediaBoost Dashboard</h1>
</header>
<main>
  <div class="cards">
    <div class="card"><h3>Total Wallet</h3><p id="totalWallet">0</p></div>
    <div class="card"><h3>Total Orders</h3><p id="totalOrders">0</p></div>
    <div class="card"><h3>Child Panels</h3><p id="childPanels">0</p></div>
  </div>

  <a href="new_order.html" class="btn">Create New Order</a>
  <a href="orders.html" class="btn">View Orders</a>
</main>

<script src="js/main.js"></script>
<script>
window.addEventListener('DOMContentLoaded', async ()=>{
  // Fetch and display stats
  const usersRes = await fetch('/api/users/wallet/user-1');
  const walletData = await usersRes.json();
  document.getElementById('totalWallet').textContent = walletData.wallet;

  const ordersRes = await fetch('/api/users');
  const orders = await ordersRes.json().catch(()=>[]);
  document.getElementById('totalOrders').textContent = orders.length;

  const childRes = await fetch('/api/child');
  const childs = await childRes.json().catch(()=>[]);
  document.getElementById('childPanels').textContent = childs.length;
});
</script>
</body>
</html>
