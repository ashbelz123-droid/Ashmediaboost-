<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AshMediaBoost | Orders</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><h1>Orders</h1></header>
<main>
<table id="ordersTable">
  <thead>
    <tr>
      <th>ID</th>
      <th>Service</th>
      <th>Quantity</th>
      <th>Price</th>
      <th>Status</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>
</main>

<script src="js/main.js"></script>
<script>
async function loadOrders(){
  const res = await fetch('/api/users');
  const orders = await res.json().catch(()=>[]);
  const tbody = document.getElementById('ordersTable').querySelector('tbody');
  tbody.innerHTML = '';
  orders.forEach(o=>{
    tbody.innerHTML += `<tr>
      <td>${o.id}</td>
      <td>${o.service}</td>
      <td>${o.quantity}</td>
      <td>${o.price}</td>
      <td>${o.status}</td>
    </tr>`;
  });
}

window.addEventListener('DOMContentLoaded', loadOrders);
</script>
</body>
</html>
