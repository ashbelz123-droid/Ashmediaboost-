<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AshMediaBoost | New Order</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><h1>Create New Order</h1></header>
<main>
<form id="orderForm">
  <select id="platform" required>
    <option value="">Select Platform</option>
  </select>
  <select id="service" required>
    <option value="">Select Service</option>
  </select>
  <input type="number" id="quantity" placeholder="Quantity" required min="1">
  <select id="country" required>
    <option value="KE">Kenya</option>
    <option value="UG">Uganda</option>
    <option value="TZ">Tanzania</option>
    <option value="RW">Rwanda</option>
    <option value="ZM">Zambia</option>
    <option value="ZW">Zimbabwe</option>
    <option value="MW">Malawi</option>
  </select>
  <button type="submit">Place Order</button>
</form>
<p id="message"></p>
</main>

<script src="js/main.js"></script>
<script>
async function loadServices(){
  const country = document.getElementById('country').value;
  const res = await fetch('/api/services?country='+country);
  const data = await res.json();
  const platformSelect = document.getElementById('platform');
  const serviceSelect = document.getElementById('service');
  platformSelect.innerHTML = '<option value="">Select Platform</option>';
  serviceSelect.innerHTML = '<option value="">Select Service</option>';
  data.services.forEach(s=>{
    platformSelect.innerHTML += `<option value="${s.platform}">${s.platform}</option>`;
    serviceSelect.innerHTML += `<option value="${s.service}">(${s.currency}) ${s.price} - ${s.service}</option>`;
  });
}

document.getElementById('country').addEventListener('change', loadServices);
window.addEventListener('DOMContentLoaded', loadServices);

document.getElementById('orderForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const platform = document.getElementById('platform').value;
  const service = document.getElementById('service').value;
  const quantity = parseInt(document.getElementById('quantity').value);
  const country = document.getElementById('country').value;

  const res = await fetch('/api/services?country='+country);
  const data = await res.json();
  const selected = data.services.find(s=>s.service===service);

  const price = selected.price * quantity;

  const orderRes = await fetch('/api/users/order',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      userId:'user-1',
      service:service,
      quantity:quantity,
      price:price
    })
  });
  const orderData = await orderRes.json();
  document.getElementById('message').textContent = orderData.message;
});
</script>
</body>
</html>
