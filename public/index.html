<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AshMediaBoost Dashboard</title>
</head>
<body>
<h1>AshMediaBoost Dashboard</h1>

<h2>Admin Login</h2>
<input id="username" placeholder="Username">
<input id="password" placeholder="Password" type="password">
<button onclick="loginAdmin()">Login Admin</button>
<pre id="loginResult"></pre>

<h2>Users</h2>
<button onclick="getUsers()">Get Users</button>
<pre id="usersResult"></pre>

<h2>Services</h2>
<button onclick="getServices()">Get Services</button>
<pre id="servicesResult"></pre>

<script>
async function loginAdmin() {
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const res = await fetch('/api/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password })
  });
  const data = await res.json();
  document.getElementById('loginResult').innerText = JSON.stringify(data, null, 2);
}

async function getUsers() {
  const res = await fetch('/api/users');
  const data = await res.json();
  document.getElementById('usersResult').innerText = JSON.stringify(data, null, 2);
}

async function getServices() {
  const res = await fetch('/api/services');
  const data = await res.json();
  document.getElementById('servicesResult').innerText = JSON.stringify(data, null, 2);
}
</script>
</body>
</html>
