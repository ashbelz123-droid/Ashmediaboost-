<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AshMediaBoost Dashboard</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    input, button { margin: 5px 0; padding: 5px; width: 200px; }
    section { margin-bottom: 30px; }
    pre { background: #f4f4f4; padding: 10px; overflow-x: auto; }
  </style>
</head>
<body>

  <h1>AshMediaBoost Full Dashboard</h1>

  <!-- SIGNUP -->
  <section>
    <h2>Signup</h2>
    <form id="signupForm">
      <input id="signupUsername" placeholder="Username" required /><br>
      <input id="signupPassword" type="password" placeholder="Password" required /><br>
      <input id="signupEmail" type="email" placeholder="Email" required /><br>
      <button type="submit">Signup</button>
    </form>
  </section>

  <!-- ADMIN LOGIN -->
  <section>
    <h2>Admin Login</h2>
    <form id="loginForm">
      <input id="loginUsername" placeholder="Username" required /><br>
      <input id="loginPassword" type="password" placeholder="Password" required /><br>
      <button type="submit">Login Admin</button>
    </form>
  </section>

  <!-- USERS -->
  <section>
    <h2>Users</h2>
    <button id="getUsers">Get Users</button>
  </section>

  <!-- SERVICES -->
  <section>
    <h2>Services</h2>
    <button id="getServices">Get Services</button>
  </section>

  <!-- CHILD PANEL ORDER -->
  <section>
    <h2>Child Panel Order</h2>
    <form id="childOrderForm">
      <input id="childUsername" placeholder="Child Username" required /><br>
      <input id="childOrder" placeholder="Order e.g. 1000 likes" required /><br>
      <button type="submit">Create Child Order</button>
    </form>
    <button id="getOrders">Get Orders</button>
  </section>

  <!-- OUTPUT -->
  <section>
    <h2>Output</h2>
    <pre id="output"></pre>
  </section>

  <script src="js/dashboard.js"></script>
</body>
                           </html>
