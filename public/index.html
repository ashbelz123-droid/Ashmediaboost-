<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AshMediaBoost Full Dashboard</title>
<style>
body { font-family: Arial; padding: 20px; background: #f0f0f0; }
h1, h2 { color: #333; }
input, button { padding: 10px; margin: 5px; font-size: 16px; }
pre { background: #222; color: #0f0; padding: 10px; overflow-x: auto; }
.section { margin-bottom: 25px; }
</style>
</head>
<body>
<h1>AshMediaBoost Full Dashboard</h1>

<div class="section">
<h2>Signup</h2>
<input type="text" id="signupUsername" placeholder="Username">
<input type="password" id="signupPassword" placeholder="Password">
<button onclick="signup()">Signup</button>
<pre id="signupOutput"></pre>
</div>

<div class="section">
<h2>Admin Login</h2>
<input type="text" id="loginUsername" placeholder="Username" value="admin">
<input type="password" id="loginPassword" placeholder="Password" value="ashimkagabasiraji256">
<button onclick="loginAdmin()">Login Admin</button>
<pre id="loginOutput"></pre>
</div>

<div class="section">
<h2>Users</h2>
<button onclick="getUsers()">Get Users</button>
<pre id="usersOutput"></pre>
</div>

<div class="section">
<h2>Services</h2>
<button onclick="getServices()">Get Services</button>
<pre id="servicesOutput"></pre>
</div>

<div class="section">
<h2>Child Panel Order</h2>
<input type="text" id="childUser" placeholder="Child Username">
<input type="text" id="childOrder" placeholder="Order e.g. 1000 likes">
<button onclick="createChildOrder()">Create Child Order</button>
<pre id="childOutput"></pre>
</div>

<div class="section">
<h2>All Orders</h2>
<button onclick="getOrders()">Get Orders</button>
<pre id="ordersOutput"></pre>
</div>

<script>
const baseUrl = "https://ashmediaboost-production.up.railway.app/api";
let token = "";

// Signup
function signup() {
  const username = document.getElementById("signupUsername").value;
  const password = document.getElementById("signupPassword").value;
  fetch(`${baseUrl}/auth/signup`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username, password })
  })
  .then(res => res.json())
  .then(data => document.getElementById("signupOutput").textContent = JSON.stringify(data, null, 2))
  .catch(err => document.getElementById("signupOutput").textContent = err);
}

// Admin Login
function loginAdmin() {
  const username = document.getElementById("loginUsername").value;
  const password = document.getElementById("loginPassword").value;
  fetch(`${baseUrl}/auth/login`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username, password })
  })
  .then(res => res.json())
  .then(data => {
    token = data.token || "";
    document.getElementById("loginOutput").textContent = JSON.stringify(data, null, 2);
  })
  .catch(err => document.getElementById("loginOutput").textContent = err);
}

// Get Users
function getUsers() {
  fetch(`${baseUrl}/users`, {
    method: "GET",
    headers: { "Authorization": `Bearer ${token}` }
  })
  .then(res => res.json())
  .then(data => document.getElementById("usersOutput").textContent = JSON.stringify(data, null, 2))
  .catch(err => document.getElementById("usersOutput").textContent = err);
}

// Get Services
function getServices() {
  fetch(`${baseUrl}/services`, {
    method: "GET"
  })
  .then(res => res.json())
  .then(data => document.getElementById("servicesOutput").textContent = JSON.stringify(data, null, 2))
  .catch(err => document.getElementById("servicesOutput").textContent = err);
}

// Create Child Panel Order
function createChildOrder() {
  const username = document.getElementById("childUser").value;
  const order = document.getElementById("childOrder").value;
  fetch(`${baseUrl}/child`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": `Bearer ${token}`
    },
    body: JSON.stringify({ username, order })
  })
  .then(res => res.json())
  .then(data => document.getElementById("childOutput").textContent = JSON.stringify(data, null, 2))
  .catch(err => document.getElementById("childOutput").textContent = err);
}

// Get All Orders
function getOrders() {
  fetch(`${baseUrl}/payments`, {
    method: "GET",
    headers: { "Authorization": `Bearer ${token}` }
  })
  .then(res => res.json())
  .then(data => document.getElementById("ordersOutput").textContent = JSON.stringify(data, null, 2))
  .catch(err => document.getElementById("ordersOutput").textContent = err);
}
</script>
</body>
</html>
