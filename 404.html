<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070711">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="stylesheet" href="assets/css/style.css">
  <title>Page not found — AshMediaBoost</title>
  <style>
    .error-page{min-height:100svh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(circle at 15% 10%,rgba(78,70,255,.18),transparent 34%),radial-gradient(circle at 90% 85%,rgba(255,133,36,.13),transparent 30%)}
    .error-wrap{width:min(100%,460px)}
    .error-brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:20px;font-size:1.2rem;font-weight:900;color:#fff;text-decoration:none}
    .error-brand img{width:42px;height:42px}
    .error-brand span span{color:#ff8a24}
    .error-card{padding:30px 22px;border-radius:28px;text-align:center}
    .error-code{font-size:clamp(4rem,20vw,7rem);line-height:.9;font-weight:950;letter-spacing:-.07em;background:linear-gradient(120deg,#299fff,#7d50ff,#f43ca2,#ff9418);-webkit-background-clip:text;background-clip:text;color:transparent}
    .error-card h1{margin:18px 0 10px;font-size:clamp(1.6rem,7vw,2.2rem)}
    .error-card p{max-width:34rem;margin:0 auto 22px;line-height:1.6}
    .error-actions{display:grid;gap:10px}
  </style>
</head>
<body>
  <main class="error-page">
    <div class="error-wrap">
      <a class="error-brand" href="index.html" aria-label="AshMediaBoost home">
        <img src="assets/logo.svg" alt="AshMediaBoost logo">
        <span>AshMedia<span>Boost</span></span>
      </a>
      <section class="error-card glass-card" aria-labelledby="error-title">
        <div class="error-code" aria-hidden="true">404</div>
        <h1 id="error-title">That page isn't here.</h1>
        <p class="muted">The link may be outdated or the page may have moved. You can safely return to AshMediaBoost and continue from there.</p>
        <div class="error-actions">
          <a class="btn btn-primary btn-block" href="index.html">Back to home</a>
          <a class="btn btn-ghost btn-block" href="marketplace.html">Browse marketplace</a>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
