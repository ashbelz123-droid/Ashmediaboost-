<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070711"><link rel="icon" type="image/svg+xml" href="assets/logo.svg"><link rel="stylesheet" href="assets/css/style.css"><title>Account — AshMediaBoost</title></head>
<body><div class="app-shell"><header class="topbar"><a class="brand" href="index.html"><img class="brand-logo" src="assets/logo.svg" alt="AshMediaBoost logo"><span>AshMedia<span>Boost</span></span></a><nav class="nav-links"><a href="marketplace.html">Marketplace</a><a href="free.html">Free Drops</a></nav><a class="btn btn-small btn-ghost" href="login.html">Login</a></header>
<main class="auth-page section-pad"><div class="auth-shell"><div class="auth-brand"><img src="assets/logo.svg" alt="AshMediaBoost logo"><div class="eyebrow">ASHMEDIABOOST ACCOUNT</div><h1>Your growth, <span>in one place.</span></h1><p>Keep your orders, wallet, rewards and support connected to one secure account.</p></div><div class="auth-card glass-card"><div class="auth-tabs"><a href="login.html">Sign in</a><a class="selected" href="register.html">Create account</a></div><form id="registerForm"><label for="name">Full name</label><input id="name" class="field" name="name" required autocomplete="name" placeholder="Your full name"><label for="email">Email address</label><input id="email" class="field" type="email" name="email" required autocomplete="email" placeholder="you@example.com"><label for="password">Password</label><div class="password-field"><input id="password" class="field" type="password" name="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters"><button type="button" id="togglePassword" aria-label="Show password">Show</button></div><label for="referral">Referral code <small>(optional)</small></label><input id="referral" class="field" name="referral" autocomplete="off" placeholder="Enter code"><label class="check-row"><input type="checkbox" required> <span>I agree to the Terms and Privacy Policy.</span></label><button class="btn btn-primary btn-block" type="submit">Create account</button><p id="formMessage" class="form-message" role="status"></p></form><div class="auth-note">Already have an account? <a href="login.html">Sign in</a></div></div></div></main><footer class="footer"><span>© <span id="year"></span> AshMediaBoost</span><div><a href="index.html">Home</a><a href="free.html">Free Drops</a></div></footer></div>
<script src="assets/js/app.js"></script><script>
const form=document.getElementById('registerForm'),msg=document.getElementById('formMessage'),pw=document.getElementById('password'),toggle=document.getElementById('togglePassword');toggle.onclick=()=>{const show=pw.type==='password';pw.type=show?'text':'password';toggle.textContent=show?'Hide':'Show'};form.addEventListener('submit',e=>{e.preventDefault();msg.textContent='Account backend is not connected yet. Your details were not submitted.';msg.className='form-message warning'});
</script></body></html>
