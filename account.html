<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070711">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="stylesheet" href="assets/css/style.css">
  <title>Account — AshMediaBoost</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="index.html" aria-label="AshMediaBoost home">
        <img class="brand-logo" src="assets/logo.svg" alt="AshMediaBoost logo">
        <span>AshMedia<span>Boost</span></span>
      </a>
      <nav class="nav-links" aria-label="Account navigation">
        <a href="marketplace.html">Marketplace</a>
        <a href="free.html">Free Drops</a>
      </nav>
      <a class="btn btn-small btn-ghost" href="dashboard.html">Dashboard</a>
    </header>

    <main class="auth-page section-pad">
      <div class="auth-shell">
        <div class="auth-brand">
          <img src="assets/logo.svg" alt="AshMediaBoost logo">
          <div class="eyebrow">MEMBER ACCOUNT</div>
          <h1>Your growth, <span>in one place.</span></h1>
          <p>Manage your AshMediaBoost account, wallet and activity from one secure member area.</p>
        </div>

        <section class="auth-card glass-card" aria-labelledby="account-title">
          <h2 id="account-title" class="sr-only">Your AshMediaBoost account</h2>
          <div id="accountLoading" class="muted" role="status" aria-live="polite">Checking your secure session…</div>
          <noscript>
            <p class="muted">JavaScript is required to securely load your account.</p>
            <a class="btn btn-primary btn-block" href="login.html">Sign in</a>
          </noscript>
        </section>
      </div>
    </main>

    <footer class="footer">
      <span>© <span id="year"></span> AshMediaBoost</span>
      <div>
        <a href="index.html">Home</a>
        <a href="marketplace.html">Marketplace</a>
        <a href="free.html">Free Drops</a>
      </div>
    </footer>
  </div>

  <script src="assets/js/supabase-config.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/account-auth.js"></script>
</body>
</html>
