<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070711"><link rel="icon" type="image/svg+xml" href="assets/logo.svg"><link rel="stylesheet" href="assets/css/style.css"><title>Create account — AshMediaBoost</title>
<style>
.auth-page{min-height:100svh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(circle at 12% 8%,rgba(78,70,255,.18),transparent 34%),radial-gradient(circle at 90% 90%,rgba(255,133,36,.14),transparent 30%)}.register-wrap{width:min(100%,430px)}.register-logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:22px;font-size:1.25rem;font-weight:900}.register-logo img{width:42px;height:42px}.register-logo span span{color:#ff8a24}.auth-card{padding:28px 22px;border-radius:28px}.auth-card h1{font-size:clamp(2rem,8vw,2.7rem);line-height:1.05;margin:10px 0 12px}.auth-sub{line-height:1.55;margin-bottom:24px}.field{min-height:54px}.password-field{position:relative}.password-field .field{padding-right:72px}.password-field button{position:absolute;right:10px;top:10px;height:34px;padding:0 12px;border:0;border-radius:10px;background:#171827;color:#cfd3df;font-weight:700}.form-message{min-height:24px;margin:14px 0 0;line-height:1.4}.form-message.info{color:#b9c6ff}.form-message.success{color:#56e69a}.form-message.error{color:#ff8b8b}.auth-switch{text-align:center;margin-top:20px}.trust-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0}.trust-item{padding:11px;border:1px solid rgba(255,255,255,.07);border-radius:14px;color:#9298a8;font-size:.78rem;text-align:center}.check{display:flex;gap:8px;align-items:flex-start}.check input{margin-top:4px}.channel-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:12px;padding:13px 16px;border-radius:14px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.035);color:#f4f6fb;text-decoration:none;font-weight:800}.channel-btn:hover{background:rgba(255,255,255,.07)}
</style></head>
<body><main class="auth-page"><div class="register-wrap">
<a class="register-logo" href="index.html"><img src="assets/logo.svg" alt="AshMediaBoost logo"><span>AshMedia<span>Boost</span></span></a>
<section class="auth-card glass-card"><div class="eyebrow">JOIN ASHMEDIABOOST</div><h1>Build your growth <span>account.</span></h1><p class="muted auth-sub">One secure account for orders, wallet activity, rewards and support.</p>
<form id="registerForm" novalidate><label for="name">Full name</label><input id="name" class="field" name="name" required autocomplete="name" placeholder="Your full name">
<label for="email">Email address</label><input id="email" class="field" name="email" type="email" required autocomplete="email" placeholder="you@example.com">
<label for="password">Password</label><div class="password-field"><input id="password" class="field" name="password" type="password" minlength="8" required autocomplete="new-password" placeholder="At least 8 characters"><button type="button" id="togglePassword">Show</button></div>
<label for="referral">Referral code <small>(optional)</small></label><input id="referral" class="field" name="referral" maxlength="32" autocomplete="off" placeholder="Enter referral code">
<label class="check"><input type="checkbox" required> <span>I agree to the Terms and Privacy Policy.</span></label>
<button class="btn btn-primary btn-block" type="submit">Create account</button><p id="formMessage" class="form-message" role="alert" aria-live="polite"></p></form>
<a class="channel-btn" href="https://whatsapp.com/channel/0029VbCSFDCBadmaR5Memh16" target="_blank" rel="noopener noreferrer">💬 Join our WhatsApp Channel</a>
<div class="trust-row"><div class="trust-item">🔒 Secure Auth</div><div class="trust-item">💳 Protected Wallet</div></div>
<p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p></section></div></main>
<script src="assets/js/supabase-config.js"></script><script src="assets/js/auth.js"></script></body></html>
