<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>Create account — AshMediaBoost</title><link rel="stylesheet" href="assets/css/style.css"></head><body><main class="auth-page"><a class="brand" href="index.html"><span class="brand-mark">A</span><span>AshMedia<span>Boost</span></span></a><section class="auth-card glass-card"><div class="eyebrow">Join AshMediaBoost</div><h1>Create your account</h1><p class="muted">Manage orders, wallet activity and support from one dashboard.</p><form id="registerForm"><label>Full name<input class="field" name="name" required autocomplete="name" placeholder="Your full name"></label><label>Email<input class="field" name="email" type="email" required autocomplete="email" placeholder="you@example.com"></label><label>Password<input class="field" name="password" type="password" minlength="8" required autocomplete="new-password" placeholder="At least 8 characters"></label><label>Referral code <span class="optional">(optional)</span><input class="field" name="referral" maxlength="32" autocomplete="off" placeholder="Referral code"></label><label class="check"><input type="checkbox" required> I agree to the Terms and Privacy Policy.</label><button class="btn btn-primary btn-block" type="submit">Create account</button><p id="formMessage" class="form-message" role="alert"></p></form><p class="auth-switch">Already have an account? <a href="login.html">Login</a></p></section></main><script src="assets/js/auth.js"></script></body></html>
