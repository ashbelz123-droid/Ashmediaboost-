<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070711"><link rel="icon" type="image/svg+xml" href="assets/logo.svg"><link rel="stylesheet" href="assets/css/style.css"><title>Login — AshMediaBoost</title></head><body><main class="auth-page section-pad"><a class="brand auth-top-brand" href="index.html"><img class="brand-logo" src="assets/logo.svg" alt="AshMediaBoost logo"><span>AshMedia<span>Boost</span></span></a><section class="auth-card glass-card"><div class="auth-tabs"><a class="selected" href="login.html">Sign in</a><a href="register.html">Create account</a></div><div class="eyebrow">WELCOME BACK</div><h1>Keep your growth <span>moving.</span></h1><p class="muted">Access your orders, wallet, rewards and support from one account.</p><form id="loginForm"><label for="email">Email address</label><input id="email" class="field" name="email" type="email" required autocomplete="email" placeholder="you@example.com"><label for="password">Password</label><div class="password-field"><input id="password" class="field" name="password" type="password" required autocomplete="current-password" placeholder="Your password"><button type="button" id="togglePassword">Show</button></div><div class="form-row"><label class="check"><input type="checkbox" name="remember"> Remember me</label><a class="text-link" href="#">Forgot password?</a></div><button class="btn btn-primary btn-block" type="submit">Sign in</button><p id="formMessage" class="form-message" role="alert"></p></form><p class="auth-switch">New here? <a href="register.html">Create an account</a></p><div class="guest-box"><strong>Ordering without an account?</strong><span>You can use the guest order flow when it is enabled.</span><a href="marketplace.html">Browse marketplace →</a></div></section></main><script>const f=document.getElementById('loginForm'),m=document.getElementById('formMessage'),p=document.getElementById('password'),t=document.getElementById('togglePassword');t.onclick=()=>{const s=p.type==='password';p.type=s?'text':'password';t.textContent=s?'Hide':'Show'};f.addEventListener('submit',e=>{e.preventDefault();m.textContent='Account backend is not connected yet. Your credentials were not submitted.';m.className='form-message warning'});</script></body></html>
